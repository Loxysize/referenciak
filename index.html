
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Burkolási referenciák</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">BURKOLÁSI <span>REFERENCIÁK</span></div>
</header>

<section class="hero">
  <p class="eyebrow">MINŐSÉGI KIVITELEZÉS</p>

  <h1>
    Gondosan kivitelezett<br>
    <span>burkolási munkák.</span>
  </h1>
</section>

<section id="munkak" class="portfolio">

  <div class="portfolio-heading">
    <p class="eyebrow">REFERENCIÁK</p>
    <h2>Néhány kép a munkáimról.</h2>
  </div>

  <div class="filters">
    <button class="active" onclick="filterWorks('all', this)">Összes</button>
    <button onclick="filterWorks('furdoszoba', this)">Fürdőszobák</button>
    <button onclick="filterWorks('terasz', this)">Teraszok</button>
    <button onclick="filterWorks('padlo', this)">Padlóburkolások</button>
    <button onclick="filterWorks('egyeb', this)">Egyéb</button>
  </div>

  <div id="gallery">
    <p class="loading">Referenciaképek betöltése...</p>
  </div>

</section>

<section class="contact">
  <p class="eyebrow">KAPCSOLAT</p>
  <h2>Érdekel a munkám?</h2>
  <p>Az elérhetőségeimet a digitális névjegyemen találod.</p>

  <a class="button"
     href="https://loxysize.github.io/nevjegy/"
     target="_blank"
     rel="noopener noreferrer">
    Digitális névjegy megnyitása ↗
  </a>
</section>

  BURKOLÁSI REFERENCIÁK © 2026
</footer>
